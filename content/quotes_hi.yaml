# Hindi renderings of each verse in content/quotes.yaml, keyed by id.
#
# Written fresh for this account from the meaning of each Sanskrit verse
# (not copied from any published Hindi translation). Same verse numbering
# as quotes.yaml.
header: "भगवद्गीता की एक सीख"
author: "भगवद्गीता"
# Added after the first two default hashtags.
hashtags: ["#gitagyan", "#hindiquotes", "#श्रीकृष्ण"]
quotes:
  # अध्याय 2
  g2-03: "कमज़ोरी के आगे मत झुको। यह तुम्हें शोभा नहीं देती। मन की इस छोटी-सी दुर्बलता को छोड़ो और उठ खड़े हो।"
  g2-07: "मेरा मन कमज़ोरी से घिर गया है और मैं अपने कर्तव्य को लेकर उलझन में हूँ। मुझे बताइए, मेरे लिए सचमुच क्या अच्छा है।"
  g2-11: "ज्ञानी लोग न जीवितों के लिए शोक करते हैं, न मृतकों के लिए।"
  g2-12: "ऐसा कोई समय नहीं था जब मैं नहीं था, न तुम, न ये राजा। और न ही आगे कभी हम में से कोई नहीं रहेगा।"
  g2-13: "जैसे आत्मा इस शरीर में बचपन, जवानी और बुढ़ापे से गुज़रती है, वैसे ही वह दूसरा शरीर पाती है। ज्ञानी इससे विचलित नहीं होते।"
  g2-14: "सुख और दुख सर्दी-गर्मी की तरह आते-जाते रहते हैं। ये टिकते नहीं। इन्हें धैर्य से सहना सीखो।"
  g2-15: "जो सुख और दुख में एक-सा रहता है, किसी से भी विचलित नहीं होता, वही मुक्ति के योग्य है।"
  g2-20: "आत्मा न कभी जन्म लेती है, न कभी मरती है। शरीर के मारे जाने पर भी वह नहीं मरती।"
  g2-22: "जैसे इंसान पुराने कपड़े उतारकर नए कपड़े पहनता है, वैसे ही आत्मा पुराने शरीर छोड़कर नए शरीर में जाती है।"
  g2-23: "आत्मा को न शस्त्र काट सकते हैं, न आग जला सकती है। न पानी उसे भिगो सकता है, न हवा उसे सुखा सकती है।"
  g2-27: "जो जन्मा है उसकी मृत्यु निश्चित है, और जो मरा है उसका जन्म निश्चित है। जो टल नहीं सकता, उस पर शोक मत करो।"
  g2-31: "अपने कर्तव्य को देखो, और डगमगाओ मत।"
  g2-38: "सुख-दुख, लाभ-हानि और जीत-हार को एक समान समझो। फिर युद्ध के लिए उठो।"
  g2-40: "इस मार्ग पर कोई प्रयास कभी व्यर्थ नहीं जाता और कोई नुकसान नहीं होता। इसका थोड़ा-सा पालन भी बड़े भय से बचा लेता है।"
  g2-41: "दृढ़ निश्चय वाला मन एक ही लक्ष्य पर टिका रहता है। अस्थिर मन के विचार अनगिनत दिशाओं में बिखर जाते हैं।"
  g2-47: "तुम्हारा अधिकार केवल कर्म पर है, उसके फल पर कभी नहीं। फल के लिए कर्म मत करो, और कर्म छोड़ो भी मत।"
  g2-48: "आसक्ति छोड़कर, सफलता और असफलता में समान रहकर, स्थिर मन से अपना काम करो। मन की यही समता योग है।"
  g2-50: "कर्म में कुशलता ही योग है।"
  g2-56: "जिसका मन दुख में नहीं डगमगाता, जो सुख की लालसा नहीं करता, और जो भय और क्रोध से मुक्त है, वही ज्ञानी कहलाता है।"
  g2-58: "जैसे कछुआ अपने अंगों को भीतर समेट लेता है, वैसे ही ज्ञानी अपनी इंद्रियों को विषयों से हटा लेता है।"
  g2-60: "बेचैन इंद्रियाँ प्रयास करते हुए ज्ञानी के मन को भी बहा ले जाती हैं।"
  g2-62: "विषयों के बारे में सोचते रहने से आसक्ति पैदा होती है। आसक्ति से इच्छा जन्म लेती है, और इच्छा से क्रोध।"
  g2-63: "क्रोध से भ्रम पैदा होता है। भ्रम से स्मृति खो जाती है। स्मृति खोने से विवेक नष्ट होता है, और विवेक नष्ट होने पर इंसान बर्बाद हो जाता है।"
  g2-64: "जो इंद्रियों को वश में रखकर, लालसा और द्वेष से मुक्त होकर दुनिया में चलता है, उसे शांति मिलती है।"
  g2-66: "जिसके पास शांति नहीं, उसे सुख कैसे मिलेगा?"
  g2-67: "जब मन भटकती इंद्रियों के पीछे चलता है, तो वह बुद्धि को ऐसे बहा ले जाता है जैसे हवा पानी पर नाव को।"
  g2-69: "जो सबके लिए रात है, उसमें संयमी जागता है। जिसे दुनिया दिन कहती है, वह ज्ञानी के लिए रात है।"
  g2-70: "नदियाँ समुद्र में गिरती रहती हैं, फिर भी वह शांत रहता है। जो इच्छाओं के आने पर भी शांत रहता है, उसे शांति मिलती है, उनके पीछे भागने वाले को नहीं।"
  g2-71: "जो सारी इच्छाएँ छोड़कर, लालसा के बिना, ‘मैं’ और ‘मेरा’ से मुक्त होकर जीता है, उसे शांति मिलती है।"

  # अध्याय 3
  g3-05: "कोई भी एक पल के लिए भी कर्म किए बिना नहीं रह सकता।"
  g3-08: "अपना कर्तव्य करो। कर्म न करने से कर्म करना बेहतर है।"
  g3-09: "अर्पण के भाव से किया गया काम तुम्हें बाँधता नहीं।"
  g3-19: "जो काम करना ज़रूरी है, उसे आसक्ति के बिना करो। आसक्ति के बिना कर्म करके इंसान परम को पाता है।"
  g3-21: "महान लोग जो करते हैं, दूसरे वही करते हैं। वे जो मानक बनाते हैं, दुनिया उसी पर चलती है।"
  g3-25: "जैसे अज्ञानी आसक्ति से कर्म करते हैं, वैसे ही ज्ञानी दुनिया की भलाई के लिए बिना आसक्ति के कर्म करें।"
  g3-27: "सारे कर्म प्रकृति के गुणों से होते हैं, पर अहंकार में उलझा इंसान सोचता है, ‘मैं करने वाला हूँ।’"
  g3-30: "अपने सारे कर्म मुझे अर्पित करो। इच्छा और ‘मेरा’ के भाव से मुक्त होकर, बिना चिंता के युद्ध करो।"
  g3-35: "दूसरे का धर्म अच्छे से निभाने से अपना धर्म अधूरा निभाना भी बेहतर है।"
  g3-37: "यह काम है, यही क्रोध है, जो रजोगुण से पैदा होता है और कभी तृप्त नहीं होता। इसे ही शत्रु जानो।"
  g3-42: "इंद्रियाँ शरीर से ऊपर हैं, मन इंद्रियों से ऊपर, बुद्धि मन से ऊपर। और आत्मा इन सबसे ऊपर है।"
  g3-43: "आत्मा को बुद्धि से भी ऊपर जानो। आत्मा के सहारे मन को स्थिर करो, और इच्छा नाम के शत्रु को जीत लो।"

  # अध्याय 4
  g4-07: "जब-जब धर्म घटता है और अधर्म बढ़ता है, मैं आता हूँ। अच्छों की रक्षा और बुराई के अंत के लिए मैं हर युग में प्रकट होता हूँ।"
  g4-10: "आसक्ति, भय और क्रोध से मुक्त होकर, बहुत से लोग ज्ञान की अग्नि में पवित्र हुए हैं।"
  g4-11: "लोग जिस भी तरह मेरी ओर आते हैं, मैं उन्हें उसी तरह अपनाता हूँ। हर राह मुझ तक ही आती है।"
  g4-18: "जो कर्म में अकर्म और अकर्म में कर्म देखता है, वही लोगों में बुद्धिमान है।"
  g4-20: "फल की आसक्ति छोड़कर, सदा संतुष्ट और किसी पर निर्भर न रहकर, ऐसा इंसान कर्म करता है, फिर भी कर्म उसे छूता नहीं।"
  g4-22: "जो मिल जाए उसमें संतुष्ट, सुख-दुख के द्वंद्वों से परे, ईर्ष्या से मुक्त और सफलता-असफलता में समान, ऐसा इंसान कभी बंधता नहीं।"
  g4-33: "ज्ञान का दान किसी भी धन के दान से बड़ा है।"
  g4-34: "ज्ञानियों के पास विनम्रता से जाओ, उनसे प्रश्न पूछो और उनकी सेवा करो। इसी तरह सत्य को जानो।"
  g4-36: "अगर तुम सबसे बड़े पापी भी हो, तब भी ज्ञान की नाव से हर पाप को पार कर जाओगे।"
  g4-38: "इस दुनिया में ज्ञान जैसा पवित्र करने वाला कुछ भी नहीं है।"
  g4-39: "जिसमें श्रद्धा है और जो इंद्रियों को वश में रखता है, उसे ज्ञान मिलता है, और ज्ञान से परम शांति आती है।"
  g4-40: "जो संदेह में डूबा रहता है, उसे न इस दुनिया में सुख मिलता है, न अगली में।"
  g4-42: "अपने मन के संदेह को ज्ञान की तलवार से काट दो। उठो और कर्म करो।"

  # अध्याय 5
  g5-10: "जो आसक्ति छोड़कर, हर कर्म ईश्वर को अर्पित करके कर्म करता है, उसे पाप वैसे ही नहीं छूता जैसे कमल के पत्ते को पानी।"
  g5-12: "कर्म का फल छोड़कर, संयमी इंसान स्थायी शांति पाता है।"
  g5-18: "ज्ञानी एक विद्वान, एक गाय, एक हाथी, एक कुत्ते और एक बहिष्कृत को समान दृष्टि से देखते हैं।"
  g5-20: "जो अच्छा लगे उस पर बहुत खुश मत हो, और जो बुरा लगे उससे परेशान मत हो।"
  g5-22: "इंद्रियों से मिलने वाले सुख दुख की जड़ हैं। वे शुरू होते हैं और खत्म हो जाते हैं। ज्ञानी उनमें आनंद नहीं ढूँढते।"
  g5-23: "जो इसी जीवन में इच्छा और क्रोध के वेग को सह सकता है, वही संयमी है और वही सुखी है।"
  g5-24: "जिसका सुख भीतर है, जिसका आनंद भीतर है और जिसका प्रकाश भीतर है, वह मुक्त हो जाता है।"

  # अध्याय 6
  g6-01: "जो फल पर निर्भर हुए बिना वह काम करता है जो करना चाहिए, वही सच्चा संन्यासी है।"
  g6-05: "अपने आप को खुद ऊपर उठाओ। खुद को गिरने मत दो। तुम ही अपने मित्र हो, और तुम ही अपने शत्रु।"
  g6-06: "जिसने मन को जीत लिया, उसके लिए मन सबसे अच्छा मित्र है। जिसने नहीं जीता, उसके लिए वही सबसे बड़ा शत्रु है।"
  g6-07: "जिसने खुद को जीत लिया, वह सर्दी-गर्मी, सुख-दुख और मान-अपमान में शांत रहता है।"
  g6-09: "जो मित्र और शत्रु, अजनबी और अपने, अच्छे और बुरे, सबको समान मन से देखता है, वह सबसे ऊपर उठ जाता है।"
  g6-16: "योग उसके लिए नहीं जो बहुत ज़्यादा या बहुत कम खाता है, और न उसके लिए जो बहुत ज़्यादा या बहुत कम सोता है।"
  g6-17: "जो खाने और आराम में, काम और नींद में संतुलित है, उसके लिए योग सारे दुख मिटा देता है।"
  g6-19: "जैसे हवा रहित जगह में दीपक की लौ नहीं काँपती, वैसा ही होता है संयमी का मन।"
  g6-23: "दुख की पकड़ से मुक्ति ही योग है।"
  g6-26: "बेचैन मन जहाँ भी भटके, उसे धीरे से वापस लाओ और आत्मा में टिका दो।"
  g6-30: "जो मुझे हर जगह देखता है और सब कुछ मुझमें देखता है, वह मुझसे कभी दूर नहीं होता, और मैं उससे कभी दूर नहीं होता।"
  g6-32: "सबसे श्रेष्ठ योगी दूसरों के सुख-दुख को अपना ही सुख-दुख समझता है।"
  g6-34: "मन चंचल है, बेचैन है, बलवान और ज़िद्दी है। इसे वश में करना हवा को बाँधने जितना कठिन लगता है।"
  g6-35: "मन चंचल है और इसे वश में करना कठिन है, पर अभ्यास और वैराग्य से इसे साधा जा सकता है।"
  g6-40: "जो भलाई करता है, उसका कभी बुरा अंत नहीं होता।"

  # अध्याय 7 से 11
  g7-03: "हज़ारों लोगों में मुश्किल से कोई एक पूर्णता के लिए प्रयास करता है।"
  g7-08: "मैं जल में स्वाद हूँ, सूर्य और चंद्रमा का प्रकाश हूँ।"
  g7-11: "मैं वह बल हूँ जो इच्छा और आसक्ति से मुक्त है।"
  g8-06: "जीवन के अंत में इंसान जिसे याद करता है, वह वही बन जाता है।"
  g8-07: "हर समय मुझे याद करो, और युद्ध करो।"
  g9-22: "जो एकनिष्ठ भक्ति से मेरी उपासना करते हैं, उन्हें जो नहीं मिला वह मैं देता हूँ, और जो उनके पास है उसकी रक्षा करता हूँ।"
  g9-26: "अगर तुम प्रेम से मुझे एक पत्ता, एक फूल, एक फल या थोड़ा-सा जल भी अर्पित करो, तो मैं प्रेम की उस भेंट को स्वीकार करता हूँ।"
  g9-27: "तुम जो भी करो, जो भी खाओ, जो भी दो, जिसके लिए भी प्रयास करो, उसे मुझे अर्पण करके करो।"
  g9-29: "मैं सभी प्राणियों के लिए समान हूँ। न कोई मुझे अप्रिय है, न कोई प्रिय। पर जो प्रेम से मुझे भजते हैं, वे मुझमें हैं और मैं उनमें।"
  g9-31: "यह निश्चित जान लो: मेरा भक्त कभी नष्ट नहीं होता।"
  g10-08: "मैं ही सब कुछ का स्रोत हूँ। सब कुछ मुझसे ही उत्पन्न होता है।"
  g10-20: "मैं हर प्राणी के हृदय में बसी आत्मा हूँ। मैं ही सभी प्राणियों का आदि, मध्य और अंत हूँ।"
  g10-41: "जो कुछ भी महिमामय, सुंदर या शक्तिशाली है, जान लो कि वह मेरे तेज के एक अंश से ही उत्पन्न हुआ है।"
  g11-12: "अगर आकाश में एक साथ हज़ार सूर्य उदय हों, तो शायद उनका प्रकाश उस महान स्वरूप के तेज जैसा हो।"
  g11-32: "मैं काल हूँ, लोकों का नाश करने वाला महाकाल।"
  g11-33: "इसलिए उठो, और यश प्राप्त करो।"

  # अध्याय 12 से 17
  g12-08: "अपना मन केवल मुझमें लगाओ और अपनी बुद्धि मुझमें टिकाओ। तब तुम मुझमें ही निवास करोगे।"
  g12-12: "अभ्यास से ज्ञान बेहतर है, ज्ञान से ध्यान बेहतर है, और ध्यान से कर्मफल का त्याग बेहतर है। त्याग के बाद तुरंत शांति मिलती है।"
  g12-13: "जो किसी प्राणी से द्वेष नहीं करता, जो मित्रवत और दयालु है, ‘मैं’ और ‘मेरा’ से मुक्त है, सुख-दुख में स्थिर और क्षमाशील है, वह मुझे प्रिय है।"
  g12-15: "जिससे दुनिया परेशान नहीं होती और जो दुनिया से परेशान नहीं होता, जो हर्ष, ईर्ष्या, भय और चिंता से मुक्त है, वह मुझे प्रिय है।"
  g12-18: "जो मित्र और शत्रु, मान और अपमान, सर्दी और गर्मी, सुख और दुख में एक समान रहता है, वह मुझे प्रिय है।"
  g12-19: "जो प्रशंसा और निंदा को एक-सा मानता है, जो शांत है और जो मिले उसमें संतुष्ट है, और जिसका मन स्थिर है, वह मुझे प्रिय है।"
  g13-08: "विनम्रता, दिखावे से दूरी, अहिंसा, सहनशीलता, सरलता, पवित्रता, स्थिरता और आत्म-संयम: यही सच्चा ज्ञान है।"
  g13-28: "जो हर प्राणी में एक ही ईश्वर को समान रूप से बसा हुआ देखता है, वह दूसरों को चोट पहुँचाकर खुद को चोट नहीं पहुँचाता।"
  g14-17: "सत्त्व से ज्ञान पैदा होता है। रज से लोभ पैदा होता है। तम से अज्ञान पैदा होता है।"
  g14-24: "जो मिट्टी के ढेले, पत्थर और सोने को समान देखता है, और प्रशंसा और निंदा में स्थिर रहता है, वह संसार से ऊपर उठ गया है।"
  g15-07: "मेरा ही एक सनातन अंश हर प्राणी में जीवात्मा बन जाता है।"
  g16-01: "निर्भयता, शुद्ध हृदय, दान, आत्म-संयम, सच्चाई, क्रोध से मुक्ति, करुणा, कोमलता और क्षमा: ये दैवी गुण हैं।"
  g16-21: "आत्म-विनाश के तीन द्वार हैं: काम, क्रोध और लोभ। इन तीनों को छोड़ दो।"
  g17-03: "इंसान अपनी श्रद्धा से बना है। जैसी उसकी श्रद्धा, वैसा ही वह।"
  g17-15: "ऐसे शब्द जो किसी को दुख न दें, जो सच्चे, प्रिय और हितकारी हों: यही वाणी का तप है।"
  g17-16: "शांत मन, कोमलता, मौन, आत्म-संयम और शुद्ध हृदय: यही मन का तप है।"
  g17-20: "जो दान यह सोचकर दिया जाए कि देना उचित है, ऐसे व्यक्ति को जो बदले में कुछ न दे सके, सही समय और सही जगह पर, वही सात्त्विक दान है।"

  # अध्याय 18
  g18-20: "जो ज्ञान सभी प्राणियों में, चाहे वे कितने ही अलग दिखें, एक ही अखंड सत्य को देखता है, वही सच्चा ज्ञान है।"
  g18-26: "जो कर्ता आसक्ति और अहंकार से मुक्त है, धैर्य और उत्साह से भरा है, और सफलता-असफलता में नहीं बदलता, वह सात्त्विक है।"
  g18-33: "जो धैर्य अनुशासित अभ्यास से मन, प्राण और इंद्रियों को थामे रखता है, वह सात्त्विक धैर्य है।"
  g18-37: "जो शुरू में ज़हर जैसा लगे पर अंत में अमृत बन जाए, वही सात्त्विक सुख है, जो निर्मल मन से जन्मता है।"
  g18-38: "जो शुरू में अमृत जैसा लगे पर अंत में ज़हर बन जाए, वह राजसिक सुख है।"
  g18-48: "जिस काम के लिए तुम जन्मे हो, उसे मत छोड़ो, भले ही उसमें दोष हों। हर काम में कोई न कोई दोष होता है, जैसे आग धुएँ से घिरी रहती है।"
  g18-58: "अपना मन मुझमें लगाओ, और मेरी कृपा से तुम हर बाधा पार कर जाओगे।"
  g18-61: "ईश्वर हर प्राणी के हृदय में निवास करता है।"
  g18-63: "इन सब बातों पर गहराई से विचार करो, और फिर जैसा चाहो वैसा करो।"
  g18-66: "बाकी सारे धर्म छोड़कर केवल मेरी शरण में आओ। मैं तुम्हें सारे पापों से मुक्त कर दूँगा। शोक मत करो।"
  g18-73: "मेरा मोह दूर हो गया। मैं दृढ़ खड़ा हूँ, मेरे संदेह मिट गए हैं। मैं वैसा ही करूँगा जैसा आप कहते हैं।"
  g18-78: "जहाँ योगेश्वर कृष्ण हैं और जहाँ धनुर्धर अर्जुन हैं, वहाँ लक्ष्मी, विजय, समृद्धि और न्याय निश्चित है।"
