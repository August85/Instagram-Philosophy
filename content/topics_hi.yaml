# Hindi versions of the hooks, reflections and CTAs in content/topics.yaml.
# Same topics, same counts and same order as the English lists.

ctas:
  - "किसी मुश्किल दिन के लिए इसे सेव कर लो।"
  - "उसे भेजो जिसे आज इसकी ज़रूरत है।"
  - "रोज़ की सीख के लिए फ़ॉलो करो।"
  - "इसे दोबारा पढ़ो।"
  - "कौन-सी पंक्ति तुम्हारे दिल में रह गई?"

topics:
  action:
    hooks: ["तैयार महसूस होने का इंतज़ार मत करो।", "सोचते रहना करना नहीं है।", "तैयार होने से पहले शुरू करो।"]
    reflections: ["आज तुम कौन-सा एक छोटा काम कर सकते हो?", "तुम क्या टालते आ रहे हो?"]
  happiness:
    hooks: ["खुशी तुम्हारी सोच से ज़्यादा पास है।", "तुम्हारे पास ज़रूरत से ज़्यादा पहले से है।", "अगर कुछ भी काफ़ी नहीं लगता, तो यह पढ़ो।"]
    reflections: ["अभी तुम किस बात के लिए आभारी हो?", "तुम्हारे लिए कितना काफ़ी होगा?"]
  anger:
    hooks: ["गुस्से में जवाब देने से पहले यह पढ़ो।", "गुस्सा जितना देता है, उससे ज़्यादा छीनता है।", "किसी ने तुम्हें चोट पहुँचाई? अब क्या?"]
    reflections: ["अगर तुम एक घंटा और रुक जाओ, तो क्या करोगे?", "जब तुम गुस्से में होते हो, तब तुम्हें कौन चला रहा होता है?"]
  change:
    hooks: ["तुम्हारे पास जो कुछ है, सब उधार का है।", "बदलाव से डर लगता है? यह पढ़ो।", "कुछ भी टिकता नहीं। यही तो बात है।"]
    reflections: ["तुम किस चीज़ को बहुत कसकर पकड़े हुए हो?", "तुम किस बदलाव से लड़ रहे हो?"]
  integrity:
    hooks: ["तुम्हारा चरित्र ही तुम्हारी असली दौलत है।", "कोई नहीं देख रहा। फिर भी सही करो।", "बातें सस्ती हैं। यह नहीं।"]
    reflections: ["अगर सब यह फ़ैसला देखते, तो क्या तुम्हें गर्व होता?", "तुम कहाँ शॉर्टकट ले रहे हो?"]
  adversity:
    hooks: ["किसी मुश्किल से गुज़र रहे हो?", "रुकावट ही रास्ता है।", "जब ज़िंदगी भारी लगे, तब यह पढ़ो।"]
    reflections: ["यह मुश्किल तुम्हें क्या सिखा रही है?", "इसके बाद तुम कैसे इंसान बनोगे?"]
  mortality:
    hooks: ["तुम्हारे पास उतना समय नहीं, जितना तुम सोचते हो।", "क्या हो अगर मृत्यु अंत नहीं है?", "एक दिन तुम नहीं जागोगे। आज तुम जागे हो।"]
    reflections: ["अगर यह तुम्हारा आख़िरी साल होता, तो क्या बदलता?", "तुम किस चीज़ को बाद के लिए बचाकर रख रहे हो?"]
  self:
    hooks: ["सबसे कठिन लड़ाई खुद से होती है।", "जब कोई नहीं देख रहा, तब तुम कौन हो?", "खोया-खोया महसूस कर रहे हो? यह पढ़ो।"]
    reflections: ["आख़िरी बार तुमने खुद की बात कब सुनी थी?", "तुम्हारा सबसे अच्छा रूप अभी क्या करता?"]
  kindness:
    hooks: ["दुनिया को इस याद की ज़रूरत है।", "किसी का दिन बेहतर बनाने की वजह बनो।", "दयालुता कमज़ोरी नहीं है।"]
    reflections: ["आज किसे तुम्हारी दया की ज़रूरत है?", "कब किसी की दयालुता ने तुम्हारा दिन बदल दिया था?"]
  present:
    hooks: ["कल में जीना बंद करो।", "आज ही वह दिन है जो तुम्हारे पास है।", "तुम ज़िंदगी शुरू होने का इंतज़ार करते जा रहे हो।"]
    reflections: ["अगर तुम अभी थोड़ा धीमे हो जाओ, तो क्या नज़र आएगा?", "तुम्हारा मन अभी कहाँ है?"]
  perspective:
    hooks: ["ऊपर से देखो, तुम्हारी परेशानियाँ छोटी लगेंगी।", "थोड़ा पीछे हटकर देखो।", "छोटा महसूस कर रहे हो? ऊपर देखो।"]
    reflections: ["क्या पाँच साल बाद इससे कोई फ़र्क पड़ेगा?", "बड़ी तस्वीर तुम्हें क्या दिखाती है?"]
  mind:
    hooks: ["तुम्हारे विचार तुम्हारी ज़िंदगी गढ़ रहे हैं।", "बात घटना की नहीं, उसके बारे में तुम्हारी कहानी की है।", "बहुत ज़्यादा सोचते हो? यह पढ़ो।"]
    reflections: ["आज कौन-सा विचार तुम्हें सबसे ज़्यादा दुख दे रहा है?", "तुम खुद को कौन-सी कहानी सुना रहे हो?"]
  time:
    hooks: ["तुम्हारे पास समय कम नहीं है। तुम उसे खर्च कर रहे हो।", "साल कहाँ चला गया?", "‘किसी दिन’ कहना बंद करो।"]
    reflections: ["इस हफ़्ते तुम्हारा समय कहाँ गया?", "तुम क्या टाल रहे हो?"]
  people:
    hooks: ["हर कोई तुम्हारी शांति का हक़दार नहीं है।", "जिनके साथ समय बिताते हो, वैसे ही बन जाते हो।", "मुश्किल लोगों से पाला पड़ा है?"]
    reflections: ["कौन तुम्हें बेहतर बनाता है?", "तुम किसे अपनी शांति भंग करने दे रहे हो?"]
  anxiety:
    hooks: ["कल की चिंता है? यह पढ़ो।", "तुम्हारे ज़्यादातर डर कभी सच नहीं होंगे।", "साँस लो। फिर यह पढ़ो।"]
    reflections: ["तुम किस चीज़ से डर रहे हो जो अभी हुई ही नहीं?", "अभी सच में क्या हो रहा है?"]
  learning:
    hooks: ["सबसे समझदार लोग यह जानते हैं।", "सीखना कभी बंद मत करो।", "गलत होना ही आगे बढ़ने का तरीका है।"]
    reflections: ["इस हफ़्ते तुमने क्या सीखा?", "तुम कहाँ जानने का दिखावा करते हो?"]
  courage:
    hooks: ["डर रुकने की वजह नहीं है।", "हिम्मत तुम्हारी सोच से ज़्यादा शांत होती है।", "आज हिम्मत दिखाओ।"]
    reflections: ["अगर तुम्हें डर न होता, तो तुम क्या करते?", "अभी तुम्हें कहाँ हिम्मत की ज़रूरत है?"]
  wealth:
    hooks: ["अमीरी मन की एक अवस्था है।", "तुम्हें और की ज़रूरत नहीं। यह पढ़ो।", "सबसे अमीर लोग सबसे कम चाहते हैं।"]
    reflections: ["तुम्हारे लिए कितना काफ़ी है?", "तुम्हारी कौन-सी चीज़ तुम पर हुकूमत करती है?"]
  purpose:
    hooks: ["क्या तुम जानते हो कि तुम कहाँ जा रहे हो?", "अपनी वजह ढूँढो।", "व्यस्त रहना और सार्थक होना एक बात नहीं।"]
    reflections: ["तुम्हारी वजह क्या है?", "तुम्हारी ज़िंदगी किस ओर जा रही है?"]
  solitude:
    hooks: ["अकेले रहना सीखो।", "मौन अकेलापन नहीं है।", "आख़िरी बार कब अपने विचारों के साथ बैठे थे?"]
    reflections: ["क्या तुम बिना फ़ोन के दस मिनट अकेले बैठ सकते हो?", "मौन में तुम्हें क्या सुनाई देता है?"]
  control:
    hooks: ["सब कुछ कंट्रोल करने की कोशिश छोड़ दो।", "मन की शांति का राज़।", "जो तुम्हारा नहीं, उसे जाने दो।"]
    reflections: ["आज तुम्हारे बस में क्या है?", "तुम किस चीज़ को कंट्रोल करना चाहते हो जो तुम्हारे बस में नहीं?"]
  patience:
    hooks: ["थोड़ा धीमे चलो।", "पानी हमेशा जीतता है।", "अच्छी चीज़ों में समय लगता है।"]
    reflections: ["तुम कहाँ जल्दबाज़ी कर रहे हो?", "किस चीज़ को तुम्हारे धैर्य की ज़्यादा ज़रूरत है?"]
  silence:
    hooks: ["कम बोलो।", "ज्ञानी चुप रहते हैं।", "मौन बोलता है।"]
    reflections: ["आख़िरी बार कब तुमने जवाब देने की जल्दी के बिना सुना था?", "आज तुम क्या अनकहा छोड़ सकते हो?"]
  love:
    hooks: ["दिल जानता है।", "हर चीज़ समझाई नहीं जा सकती।", "प्रेम तर्क नहीं है।"]
    reflections: ["तुम्हारा दिल पहले से क्या जानता है?", "तुम किसे बिना वजह प्यार करते हो?"]
  simplicity:
    hooks: ["तुम्हारी ज़िंदगी बहुत उलझी हुई है।", "सरल बनो।", "कम, पर बेहतर।"]
    reflections: ["इस हफ़्ते तुम अपनी ज़िंदगी से क्या हटा सकते हो?", "तुम्हारे लिए सच में क्या मायने रखता है?"]
