   text: "What you do not want done to yourself, do not do to others."}
- {id: cf03, author: Confucius, work: "Analects 14.27", topic: integrity, checked: false,
   text: "The superior man is modest in his speech, but exceeds in his actions."}
- {id: cf04, author: Confucius, work: "Analects 2.24", topic: courage, checked: false,
   text: "To see what is right and not to do it is want of courage."}
- {id: cf05, author: Confucius, work: "Analects 2.15", topic: learning, checked: false,
   text: "Learning without thought is labour lost; thought without learning is perilous."}
- {id: cf06, author: Confucius, work: "Analects 4.17", topic: people, checked: false,
