- {id: bg01, author: Bhagavad Gita, work: "Chapter 2, verse 47 (paraphrase)", topic: action, checked: false,
   text: "You have a right to your actions, but never to the fruits of your actions."}
- {id: bg02, author: Bhagavad Gita, work: "Chapter 3, verse 35", topic: purpose, checked: false,
   text: "Better is one's own duty, though imperfectly performed, than the duty of another well performed."}
- {id: bg03, author: Bhagavad Gita, work: "Chapter 6, verse 35 (paraphrase)", topic: mind, checked: false,
