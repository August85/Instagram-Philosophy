- {id: lz02, author: Laozi, work: "Tao Te Ching 33", topic: self, checked: false,
   text: "He who knows others is wise; he who knows himself is enlightened."}
- {id: lz03, author: Laozi, work: "Tao Te Ching 33", topic: self, checked: false,
   text: "He who overcomes others is strong; he who overcomes himself is mighty."}
