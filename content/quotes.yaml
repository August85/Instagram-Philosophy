   text: "If one man conquer in battle a thousand times a thousand men, and another conquer himself, he is the greatest of conquerors."}
- {id: bu04, author: The Buddha, work: "Dhammapada 204", topic: happiness, checked: false,
   text: "Health is the greatest of gifts, contentedness the greatest of riches."}
