# Quote bank. Every reel is built from one of these.
#
# Wording follows public-domain English translations (Long, Gummere, Legge,
# Muller, Arnold) or the author's own English. Lines marked "paraphrase" are
# common modern renderings of a real passage, not a word-for-word translation.
#
# checked: false means nobody has compared the wording to the source yet.
# Run `philoreels quotes --unchecked` to list them, verify, then set true.
#
# topic must be one of the keys in content/topics.yaml.

- {id: ma01, author: Marcus Aurelius, work: "Meditations 10.16", topic: action, checked: false,
   text: "Waste no more time arguing about what a good man should be. Be one."}
- {id: ma02, author: Marcus Aurelius, work: "Meditations 7.67", topic: happiness, checked: false,
   text: "Very little is needed to make a happy life; it is all within yourself, in your way of thinking."}
- {id: ma03, author: Marcus Aurelius, work: "Meditations 6.6", topic: anger, checked: false,
   text: "The best way of avenging yourself is not to become like the wrongdoer."}
- {id: ma04, author: Marcus Aurelius, work: "Meditations 9.35", topic: change, checked: false,
   text: "Loss is nothing else but change, and change is Nature's delight."}
- {id: ma05, author: Marcus Aurelius, work: "Meditations 12.17", topic: integrity, checked: false,
   text: "If it is not right, do not do it; if it is not true, do not say it."}
- {id: ma06, author: Marcus Aurelius, work: "Meditations 5.20", topic: adversity, checked: false,
   text: "The impediment to action advances action. What stands in the way becomes the way."}
- {id: ma07, author: Marcus Aurelius, work: "Meditations 4.17", topic: mortality, checked: false,
   text: "Do not act as if you were going to live ten thousand years. While you live, while it is in your power, be good."}
- {id: ma08, author: Marcus Aurelius, work: "Meditations 11.18", topic: anger, checked: false,
   text: "How much more grievous are the consequences of anger than the causes of it."}
- {id: ma09, author: Marcus Aurelius, work: "Meditations 7.59", topic: self, checked: false,
   text: "Look within. Within is the fountain of good, and it will ever bubble up, if you will ever dig."}
- {id: ma10, author: Marcus Aurelius, work: "Meditations 6.39", topic: kindness, checked: false,
   text: "Love the people with whom fate brings you together, and do so with all your heart."}
- {id: ma11, author: Marcus Aurelius, work: "Meditations 3.7", topic: integrity, checked: false,
   text: "Never value anything as profitable that compels you to break your promise or lose your self-respect."}
- {id: ma12, author: Marcus Aurelius, work: "Meditations 7.29", topic: present, checked: false,
   text: "Confine yourself to the present."}
- {id: ma13, author: Marcus Aurelius, work: "Meditations 7.47", topic: perspective, checked: false,
   text: "Look round at the courses of the stars, as if you were going along with them."}
- {id: ma14, author: Marcus Aurelius, work: "Meditations 5.16", topic: mind, checked: false,
   text: "Such as are your habitual thoughts, such also will be the character of your mind; for the soul is dyed by the thoughts."}
- {id: ma15, author: Marcus Aurelius, work: "Meditations 4.7", topic: mind, checked: false,
   text: "Take away your opinion, and then there is taken away the complaint, 'I have been harmed.'"}
- {id: ma16, author: Marcus Aurelius, work: "Meditations 4.43", topic: time, checked: false,
   text: "Time is a sort of river of passing events, and strong is its current."}
- {id: ma17, author: Marcus Aurelius, work: "Meditations 2.1", topic: people, checked: false,
   text: "Begin the morning by saying to yourself: I shall meet with the busy-body, the ungrateful, the arrogant. But none of them can injure me."}
- {id: ma18, author: Marcus Aurelius, work: "Meditations 8.47", topic: mind, checked: false,
   text: "If you are pained by any external thing, it is not this thing that disturbs you, but your own judgement about it."}

- {id: se01, author: Seneca, work: "Letters to Lucilius 13", topic: anxiety, checked: false,
   text: "We are more often frightened than hurt; and we suffer more from imagination than from reality."}
- {id: se02, author: Seneca, work: "Letters to Lucilius 1", topic: time, checked: false,
   text: "While we are postponing, life speeds by."}
- {id: se03, author: Seneca, work: "On the Shortness of Life", topic: time, checked: false,
   text: "It is not that we have a short time to live, but that we waste a lot of it."}
- {id: se04, author: Seneca, work: "Letters to Lucilius (paraphrase)", topic: adversity, checked: false,
   text: "Difficulties strengthen the mind, as labour does the body."}
- {id: se05, author: Seneca, work: "Letters to Lucilius 76", topic: learning, checked: false,
   text: "As long as you live, keep learning how to live."}
- {id: se06, author: Seneca, work: "Letters to Lucilius 76", topic: learning, checked: false,
   text: "No man was ever wise by chance."}
- {id: se07, author: Seneca, work: "On the Happy Life", topic: kindness, checked: false,
   text: "Wherever there is a human being, there is an opportunity for a kindness."}
- {id: se08, author: Seneca, work: "Letters to Lucilius 101", topic: present, checked: false,
   text: "Begin at once to live, and count each separate day as a separate life."}
- {id: se09, author: Seneca, work: "On Anger", topic: anger, checked: false,
   text: "The greatest remedy for anger is delay."}
- {id: se10, author: Seneca, work: "Letters to Lucilius 7", topic: people, checked: false,
   text: "Associate with those who will make a better man of you."}
- {id: se11, author: Seneca, work: "Letters to Lucilius 78", topic: courage, checked: false,
   text: "Sometimes even to live is an act of courage."}
- {id: se12, author: Seneca, work: "Letters to Lucilius 2", topic: wealth, checked: false,
   text: "It is not the man who has too little, but the man who craves more, that is poor."}
- {id: se13, author: Seneca, work: "Letters to Lucilius 71", topic: purpose, checked: false,
   text: "If a man does not know to which port he is sailing, no wind is favourable."}
- {id: se14, author: Seneca, work: "Letters to Lucilius 2", topic: solitude, checked: false,
   text: "The primary indication of a well-ordered mind is a man's ability to remain in one place and linger in his own company."}
- {id: se15, author: Seneca, work: "Letters to Lucilius 1", topic: time, checked: false,
   text: "Hold every hour in your grasp. Lay hold of today's task, and you will not need to depend so much upon tomorrow's."}
- {id: se16, author: Seneca, work: "On Providence", topic: adversity, checked: false,
   text: "Fire tests gold, suffering tests brave men."}
- {id: se17, author: Seneca, work: "Letters to Lucilius 9", topic: happiness, checked: false,
   text: "He who is not satisfied with what he has would not be satisfied with what he would like to have."}
- {id: se18, author: Seneca, work: "Letters to Lucilius 5", topic: anxiety, checked: false,
   text: "Cease to hope, and you will cease to fear."}
- {id: se19, author: Seneca, work: "On Tranquillity of Mind", topic: change, checked: false,
   text: "We must not be too attached to the things we have; they are lent, not given."}
- {id: se20, author: Seneca, work: "Letters to Lucilius 28", topic: self, checked: false,
   text: "You need a change of soul rather than a change of climate."}

- {id: ep01, author: Epictetus, work: "Enchiridion 5", topic: mind, checked: false,
   text: "Men are disturbed not by things, but by the views which they take of things."}
- {id: ep02, author: Epictetus, work: "Enchiridion 1", topic: control, checked: false,
   text: "Some things are within our power, while others are not."}
- {id: ep03, author: Epictetus, work: "Fragments", topic: self, checked: false,
   text: "No man is free who is not master of himself."}
- {id: ep04, author: Epictetus, work: "Discourses 3.23", topic: purpose, checked: false,
   text: "First say to yourself what you would be; and then do what you have to do."}
- {id: ep05, author: Epictetus, work: "Fragments (paraphrase)", topic: wealth, checked: false,
   text: "Wealth consists not in having great possessions, but in having few wants."}
- {id: ep06, author: Epictetus, work: "Enchiridion 13", topic: learning, checked: false,
   text: "If you want to improve, be content to be thought foolish and stupid."}
- {id: ep07, author: Epictetus, work: "Enchiridion 8", topic: control, checked: false,
   text: "Do not seek for things to happen as you wish, but wish them to happen as they do, and you will go on well."}
- {id: ep08, author: Epictetus, work: "Discourses 2.1", topic: learning, checked: false,
   text: "Only the educated are free."}
- {id: ep09, author: Epictetus, work: "Fragments", topic: happiness, checked: false,
   text: "He is a wise man who does not grieve for the things which he has not, but rejoices for those which he has."}
- {id: ep10, author: Epictetus, work: "Discourses 1.24", topic: adversity, checked: false,
   text: "It is difficulties that show what men are."}
- {id: ep11, author: Epictetus, work: "Discourses 4.1", topic: control, checked: false,
   text: "Freedom is not procured by a full enjoyment of what is desired, but by controlling the desire."}
- {id: ze01, author: Zeno of Citium, work: "via Diogenes Laertius", topic: people, checked: false,
   text: "We have two ears and one mouth, so that we may listen more and talk less."}

- {id: lz01, author: Laozi, work: "Tao Te Ching 64", topic: action, checked: false,
