[project]
name = "philoreels"
version = "0.1.0"
description = "Generate, render and auto-post philosophy reels to Instagram"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6", "Pillow>=10", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
philoreels = "philoreels.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["philoreels"]
